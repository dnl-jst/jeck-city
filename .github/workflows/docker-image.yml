# Builds the production image (game server + built client + world, one port) and pushes it to GitHub Container
# Registry: ghcr.io/<owner>/nippes-nights. Deploy it behind a TLS reverse proxy (see deploy/Caddyfile.example, README
# "Mehrspieler betreiben").
#
# Tags: `latest` and `sha-<short>` for the default branch, `<branch>` for other pushed branches (manual runs),
# `1.2.3` / `1.2` for tags `v1.2.3`.
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nippes-nights

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Raw open data (OSM, LoD2, DGM1; ~400 MB). The pipeline only downloads what is missing, so a cache hit skips
      # the download. One cache per month: OSM changes over time, but builds within a month use the same snapshot.
      - id: month
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: data/raw
          key: pipeline-raw-${{ steps.month.outputs.m }}

      - name: Build the world (apps/client/public/world)
        run: npm run pipeline

      - run: npm run typecheck
      - run: npm test

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build once into the local Docker daemon and smoke-test it before anything is pushed.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: nippes-nights:ci
          # the image layers (npm ci, client build + precompression) are cached between runs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (healthcheck, page, world, clean shutdown)
        run: |
          docker run -d --name nn -p 127.0.0.1:2567:2567 nippes-nights:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:2567/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:2567/healthz | grep -q '"players":0'
          curl -fsS -o /dev/null http://127.0.0.1:2567/
          curl -fsS -o /dev/null -H 'Accept-Encoding: br' http://127.0.0.1:2567/world/manifest.json
          time docker stop -t 10 nn
          docker logs nn | tail -20

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
