# Builds the production image (game server + built client + world, one port; with the repository variable WORLD_URL
# the world is published to object storage first and the image carries only the server's world files) and pushes it to GitHub Container Registry: ghcr.io/<owner>/nippes-nights. Deploy
# it behind a TLS reverse proxy (see deploy/Caddyfile.example, README "Mehrspieler betreiben").
#
# Runs automatically only for tags `v*`; main (and any other branch) is built by starting the workflow manually
# (Actions → Docker image → Run workflow).
#
# Tags: `latest` and `sha-<short>` for the default branch, `<branch>` for other branches (manual runs),
# `1.2.3` / `1.2` for tags `v1.2.3`.
name: Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nippes-nights

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Raw open data (OSM, LoD2, DGM1; ~400 MB). The pipeline only downloads what is missing, so a cache hit skips
      # the download. One cache per month: OSM changes over time, but builds within a month use the same snapshot.
      # An older month is restored as a fallback; it is only refreshed when this month's download works (Overpass
      # is often overloaded), see the "Refresh OSM" step.
      - id: month
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: raw
        uses: actions/cache/restore@v6
        with:
          path: data/raw
          key: pipeline-raw-${{ steps.month.outputs.m }}
          restore-keys: pipeline-raw-

      - name: Refresh OSM for a new month (keep the old snapshot if Overpass is down)
        if: steps.raw.outputs.cache-hit != 'true' && steps.raw.outputs.cache-matched-key != ''
        run: |
          mv data/raw/osm.json data/raw/osm.previous.json
          if ! npx tsx -e "import('./packages/pipeline/src/fetch.ts').then((f) => f.fetchOsm('data/raw'))"; then
            echo "::warning::Overpass unreachable, building with last month's OSM snapshot"
            mv data/raw/osm.previous.json data/raw/osm.json
          fi
          rm -f data/raw/osm.previous.json

      - name: Build the world (apps/client/public/world)
        run: npm run pipeline

      # saved right away, so a later failing step (tests, image) does not throw the downloads away
      - if: steps.raw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: data/raw
          key: pipeline-raw-${{ steps.month.outputs.m }}

      - run: npm run typecheck
      - run: npm test

      # Image variant. With the repository variable WORLD_URL set, the world is published to object storage and the
      # image carries only the files the server loads (WORLD_FILES=server); browsers load the world from the bucket.
      # Without it the image carries the whole world (WORLD_FILES=full) and nothing is published. WORLD_URL may only
      # be set once the bucket has its CORS rule (deploy/object-storage-cors.json): without it browsers cannot load
      # the world from there.
      - id: variant
        run: echo "world_files=${{ vars.WORLD_URL != '' && 'server' || 'full' }}" >> "$GITHUB_OUTPUT"

      # Upload the world (content-addressed objects, never overwritten; worlds/<hash>.json last).
      - name: Publish the world to object storage
        if: steps.variant.outputs.world_files == 'server'
        run: npm run world:publish
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

      # the Dockerfile copies .precompress-cache/ (compressed variants of earlier builds); empty here
      - run: mkdir -p .precompress-cache

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build once into the local Docker daemon and smoke-test it before anything is pushed.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: nippes-nights:ci
          build-args: WORLD_FILES=${{ steps.variant.outputs.world_files }}
          # the image layers (npm ci, client build + precompression) are cached between runs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Without players the restart countdown is skipped, so `docker stop -t 10` still shuts down cleanly.
      - name: Smoke test (healthcheck, page, world, with WORLD_URL the world in the bucket, clean shutdown)
        env:
          WORLD_FILES: ${{ steps.variant.outputs.world_files }}
          WORLD_URL: ${{ vars.WORLD_URL }}
        run: |
          if [ "$WORLD_FILES" = server ]; then
            docker run -d --name nn -p 127.0.0.1:2567:2567 -e WORLD_URL="$WORLD_URL" nippes-nights:ci
          else
            docker run -d --name nn -p 127.0.0.1:2567:2567 nippes-nights:ci
          fi
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:2567/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:2567/healthz | grep -q '"players":0'
          curl -fsS -o /dev/null http://127.0.0.1:2567/
          curl -fsS -o /dev/null -H 'Accept-Encoding: br' http://127.0.0.1:2567/world/manifest.json
          curl -fsS -o /dev/null http://127.0.0.1:2567/world/index.json
          if [ "$WORLD_FILES" = server ]; then
            curl -fsS http://127.0.0.1:2567/config.json | grep -q worldUrl
            # the server checks in the background that the bucket holds this world
            for i in $(seq 1 10); do curl -fsS http://127.0.0.1:2567/healthz | grep -q '"worldPublished":true' && break; sleep 1; done
            curl -fsS http://127.0.0.1:2567/healthz | grep -q '"worldPublished":true'
          else
            curl -fsS http://127.0.0.1:2567/config.json | grep -q '"worldUrl":null'
          fi
          time docker stop -t 10 nn
          docker logs nn | tail -20

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: WORLD_FILES=${{ steps.variant.outputs.world_files }}
          cache-from: type=gha
